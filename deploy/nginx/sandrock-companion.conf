# Inclua este bloco no Nginx compartilhado da VPS após conectar os containers
# à mesma rede Docker externa. Não publique 80/443 pelo Compose deste projeto.
upstream sandrock_companion {
    server sandrock_companion:80;
}

server {
    listen 80;
    server_name sandrock.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://sandrock.example.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sandrock.example.com;

    ssl_certificate /etc/letsencrypt/live/sandrock.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandrock.example.com/privkey.pem;

    location / {
        proxy_pass http://sandrock_companion;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
